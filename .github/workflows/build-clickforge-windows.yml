name: Build ClickForge for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "clickforge/**"
      - ".github/workflows/build-clickforge-windows.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clickforge/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: clickforge
        run: npm ci

      - name: Build Windows installers
        working-directory: clickforge
        run: npm run tauri build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ClickForge-Windows
          path: |
            clickforge/src-tauri/target/release/bundle/nsis/*.exe
            clickforge/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
